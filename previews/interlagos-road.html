<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="referrer" content="no-referrer"><meta name="robots" content="noindex">
<title>Interlagos road evolution — Rookline Drive</title>
<link rel="stylesheet" href="../styles.css"><link rel="stylesheet" href="../imola-replay.css?v=imola-1"><link rel="stylesheet" href="daytona-replay.css?v=style-20261108">
<script src="../interlagos-replay.js?v=combined-r8" defer></script>
</head><body>
<section id="interlagos-road-evolution" class="imola-replay" aria-label="Interlagos road evolution preview">
  <svg class="imola-map" viewBox="0 0 680 350" role="img" aria-labelledby="interlagos-title interlagos-desc">
    <title id="interlagos-title">Interlagos, after the storm</title>
    <desc id="interlagos-desc">Recorded weather and estimated surface conditions. Separate stretches change from white for dry through teal for damp to blue for wet.</desc>
    <defs data-gradients></defs><path data-outline fill="none" stroke="var(--muted-foreground)" stroke-width="9" stroke-linejoin="round" stroke-linecap="round" opacity=".65"></path><g data-segments fill="none" stroke-width="5" stroke-linecap="round"></g>
  </svg>
  <div class="imola-legend" aria-label="Wetness colour scale">
    <span><i style="--wet-colour:#ffffff" aria-hidden="true"></i>Dry</span><span><i style="--wet-colour:#73ecd9" aria-hidden="true"></i>Damp</span><span><i style="--wet-colour:#59d4ed" aria-hidden="true"></i>Slightly wet</span><span><i style="--wet-colour:#48acf5" aria-hidden="true"></i>Wet</span><span><i style="--wet-colour:#2789ef" aria-hidden="true"></i>Very wet</span><span><i style="--wet-colour:#3478e6" aria-hidden="true"></i>Extremely wet</span>
  </div>
  <div class="imola-controls">
    <button type="button" data-play aria-label="Play Interlagos wetness replay">Play</button>
    <div class="imola-time"><label for="interlagos-time">Session time <output data-time for="interlagos-time">0:06</output></label><input id="interlagos-time" type="range" min="6" max="1824.2" step=".2" value="6"></div>
    <div class="imola-speed"><label for="interlagos-speed">Speed</label><select id="interlagos-speed"><option value="20">20×</option><option value="40" selected>40×</option><option value="80">80×</option></select></div>
    <button type="button" data-start>Start</button>
  </div>
  <span class="visually-hidden" data-status role="status" aria-live="polite">Replay paused at the beginning.</span>
</section>
</body></html>
