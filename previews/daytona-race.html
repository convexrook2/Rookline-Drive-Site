<script>
  (()=>{
    const root=document.getElementById('daytona-recorded-wetness-v1'),query=s=>root.querySelector(s),ns='http://www.w3.org/2000/svg';

    const project=(x,z)=>[340+(x-(minimumX+maximumX)/2)*scale,175-(z-(minimumZ+maximumZ)/2)*scale];
    const map=data.path.map(p=>[p[0],...project(p[1],p[2])]);
    query('[data-outline]').setAttribute('d',map.map((p,i)=>(i?'L':'M')+p[1].toFixed(2)+','+p[2].toFixed(2)).join(' '));

    function before(rows,t,key){let low=0,high=rows.length-1;while(low<high){const middle=Math.ceil((low+high)/2);if(key(rows[middle])<=t)low=middle;else high=middle-1;}return low;}
    function sample(t){const i=before(frames,t,row=>row.t),a=frames[i],b=frames[Math.min(i+1,frames.length-1)],f=a===b?0:Math.max(0,Math.min(1,(t-a.t)/(b.t-a.t)));return{cells:a.cells.map((v,k)=>(v+(b.cells[k]-v)*f)/10000),reported:a.reported};}
    function carAt(t){const rows=data.cars;if(!rows?.length)return null;const i=before(rows,t,row=>row[0]),a=rows[i],b=rows[Math.min(i+1,rows.length-1)],f=a===b?0:Math.max(0,Math.min(1,(t-a[0])/(b[0]-a[0])));return project(a[1]+(b[1]-a[1])*f,a[2]+(b[2]-a[2])*f);}
    let time=first,speed=40,running=false,previous=0,animation=0,lastSaved=null;
    function render(){const state=sample(time),cells=state.cells,n=cells.length;
      const at=d=>{const p=d/data.length*n-.5,i=Math.floor(p),f=p-i;return cells[(i%n+n)%n]*(1-f)+cells[((i+1)%n+n)%n]*f;};
      for(const[a,b,start,end]of paints){start.setAttribute('stop-color',colour(at(a)));end.setAttribute('stop-color',colour(at(b)));}
      const car=carAt(time);query('[data-car]').setAttribute('visibility',car?'visible':'hidden');if(car){query('[data-car]').setAttribute('cx',car[0]);query('[data-car]').setAttribute('cy',car[1]);}
      query('[data-time]').textContent=clock(time);query('[data-reported]').textContent=percent(state.reported);query('[data-mean]').textContent=percent(cells.reduce((a,b)=>a+b,0)/n);
      slider.value=time;play.textContent=running?'Pause':'Play';play.setAttribute('aria-label',running?'Pause Daytona wetness replay':'Play Daytona wetness replay');
    }
    function pause(){running=false;cancelAnimationFrame(animation);previous=0;}
    function save(){}
    function tick(now){if(!running)return;if(!previous)previous=now;if(now-previous>=40){time=Math.min(last,time+Math.min((now-previous)/1000,.25)*speed);previous=now;render();}if(time>=last){pause();render();query('[data-status]').textContent='Replay reached your finish.';save();return;}animation=requestAnimationFrame(tick);}
    play.addEventListener('click',()=>{if(running)pause();else{if(time>=last)time=first;running=true;previous=0;animation=requestAnimationFrame(tick);}render();query('[data-status]').textContent=(running?'Playing from ':'Paused at ')+clock(time);save();});
    slider.addEventListener('input',()=>{pause();time=Math.max(first,Math.min(last,Number(slider.value)));render();});
    slider.addEventListener('change',()=>{query('[data-status]').textContent='Selected race time '+clock(time);save();});
    speedControl.addEventListener('change',()=>{speed=Number(speedControl.value);save();});
    query('[data-start]').addEventListener('click',()=>{pause();time=first;render();query('[data-status]').textContent='Race time 25:00.';save();});
    document.addEventListener('visibilitychange',()=>{if(document.hidden&&running){pause();render();}});
    if(typeof IntersectionObserver==='function')new IntersectionObserver(entries=>{if(!entries.some(e=>e.isIntersecting)&&running){pause();render();}}).observe(root);
    if(typeof ResizeObserver==='function')new ResizeObserver(entries=>query('[data-car]').setAttribute('r',Math.max(5.5,4.5*680/entries[0].contentRect.width))).observe(query('.replay-map'));
    render();
  })();
  </script>
</section>
